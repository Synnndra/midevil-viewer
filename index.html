<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidEvils Gallery</title>
    <meta name="description" content="Browse every MidEvil by trait, find the 1/1s, visit the Graveyard, and connect your wallet to see your own.">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MidEvils">
    <meta property="og:title" content="MidEvils Gallery">
    <meta property="og:description" content="Browse every MidEvil by trait, find the 1/1s, and see your own.">
    <meta property="og:url" content="https://gallery.midevils.com/">
    <meta property="og:image" content="https://gallery.midevils.com/og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MidEvils Gallery">
    <meta name="twitter:description" content="Browse every MidEvil by trait, find the 1/1s, and see your own.">
    <meta name="twitter:image" content="https://gallery.midevils.com/og.jpg">
    <link rel="preconnect" href="https://assets.midevils.com">
    <link rel="stylesheet" href="style.css?v=20261031x">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <img src="MidLogo.png" alt="MidEvil" class="logo-img">
                <div class="header-stats">
                    <span id="totalCount" class="stat">0 Items</span>
                    <button id="walletBtn" class="wallet-btn" type="button">Connect wallet</button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Sidebar Filters -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>Filters</h2>
                    <button id="clearFilters" class="clear-btn">Clear All</button>
                </div>

                <div class="filter-section collection-toggle">
                    <label class="filter-option">
                        <input type="checkbox" id="graveyardToggle" class="filter-checkbox">
                        <span class="filter-value">Graveyard MidEvils</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" id="oneOfOnesToggle" class="filter-checkbox">
                        <span class="filter-value">1/1s Only</span>
                    </label>
                    <label class="filter-option" id="mineToggleWrap" hidden>
                        <input type="checkbox" id="mineToggle" class="filter-checkbox">
                        <span class="filter-value" id="mineToggleLabel">My MidEvils</span>
                    </label>
                </div>

                <div id="filterGroups" class="filter-groups"></div>
            </aside>

            <!-- Gallery -->
            <section class="gallery-container">
                <!-- Gallery Controls -->
                <div class="gallery-controls">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search ID">
                    <div class="gallery-controls-right">
                        <select id="sortSelect" class="sort-select">
                            <option value="random">Sort: Random</option>
                            <option value="number">Sort: Number</option>
                        </select>
                    </div>
                </div>

                <!-- Active Filters -->
                <div class="active-filters-row">
                    <span class="filters-label">Filters:</span>
                    <div id="activeFilters" class="active-filters"><span class="no-filters">None</span></div>
                </div>

                <!-- Mobile Filter Toggle -->
                <button id="filterToggle" class="filter-toggle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="6" x2="20" y2="6"></line>
                        <line x1="4" y1="12" x2="20" y2="12"></line>
                        <line x1="4" y1="18" x2="20" y2="18"></line>
                    </svg>
                    Filters
                </button>

                <!-- Loading State -->
                <div id="loading" class="loading">
                    <div class="loader"></div>
                    <p>Loading Collection...</p>
                </div>

                <!-- Error State -->
                <div id="error" class="error" style="display: none;"></div>

                <!-- NFT Grid -->
                <div id="nftGrid" class="nft-grid"></div>
            </section>
        </main>

        <!-- NFT Details Modal -->
        <div id="detailsModal" class="modal" style="display: none;">
            <div class="modal-content details-modal">
                <button id="closeDetails" class="close-btn modal-close">&times;</button>
                <img id="detailsImage" src="" alt="" class="details-image">
                <h2 id="detailsTitle" class="details-title"></h2>
                <button id="downloadBtn" class="download-btn" type="button">Download full size</button>
                <div id="detailsTraits" class="details-traits"></div>
                <div id="detailsMint" class="details-mint"></div>
            </div>
        </div>

        <!-- Wallet Modal: connect only. The site never asks the wallet to sign anything. -->
        <div id="walletModal" class="modal" style="display: none;">
            <div class="modal-content wallet-modal" role="dialog" aria-labelledby="walletModalTitle">
                <button id="closeWallet" class="close-btn modal-close" type="button" aria-label="Close">&times;</button>
                <h2 id="walletModalTitle" class="wallet-title">See your MidEvils</h2>
                <p class="wallet-note">Connecting only shares your public address. Nothing to sign, no transactions.</p>
                <div id="walletOptions" class="wallet-options"></div>
                <p id="walletStatus" class="wallet-status" role="status"></p>
                <div class="wallet-divider"><span>or paste wallet addresses</span></div>
                <textarea id="walletPaste" class="wallet-paste" rows="3" placeholder="One or more addresses, separated by spaces, commas or new lines" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
                <button id="walletPasteBtn" class="download-btn" type="button">Show MidEvils</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=20261031y"></script>
</body>
</html>
