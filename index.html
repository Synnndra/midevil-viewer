<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidEvil Gallery</title>
    <link rel="preconnect" href="https://assets.midevils.com">
    <link rel="stylesheet" href="style.css?v=20261031">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <img src="MidLogo.png" alt="MidEvil" class="logo-img">
                <div class="header-stats">
                    <span id="totalCount" class="stat">0 Items</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Sidebar Filters -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>Filters</h2>
                    <button id="clearFilters" class="clear-btn">Clear All</button>
                </div>

                <div class="filter-section collection-toggle">
                    <label class="filter-option">
                        <input type="checkbox" id="graveyardToggle" class="filter-checkbox">
                        <span class="filter-value">Graveyard MidEvils</span>
                    </label>
                    <label class="filter-option">
                        <input type="checkbox" id="oneOfOnesToggle" class="filter-checkbox">
                        <span class="filter-value">1/1s Only</span>
                    </label>
                </div>

                <div id="filterGroups" class="filter-groups"></div>
            </aside>

            <!-- Gallery -->
            <section class="gallery-container">
                <!-- Gallery Controls -->
                <div class="gallery-controls">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search ID">
                    <div class="gallery-controls-right">
                        <select id="sortSelect" class="sort-select">
                            <option value="random">Sort: Random</option>
                            <option value="number">Sort: Number</option>
                        </select>
                    </div>
                </div>

                <!-- Active Filters -->
                <div class="active-filters-row">
                    <span class="filters-label">Filters:</span>
                    <div id="activeFilters" class="active-filters"><span class="no-filters">None</span></div>
                </div>

                <!-- Mobile Filter Toggle -->
                <button id="filterToggle" class="filter-toggle">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="6" x2="20" y2="6"></line>
                        <line x1="4" y1="12" x2="20" y2="12"></line>
                        <line x1="4" y1="18" x2="20" y2="18"></line>
                    </svg>
                    Filters
                </button>

                <!-- Loading State -->
                <div id="loading" class="loading">
                    <div class="loader"></div>
                    <p>Loading Collection...</p>
                </div>

                <!-- Error State -->
                <div id="error" class="error" style="display: none;"></div>

                <!-- NFT Grid -->
                <div id="nftGrid" class="nft-grid"></div>
            </section>
        </main>

        <!-- NFT Details Modal -->
        <div id="detailsModal" class="modal" style="display: none;">
            <div class="modal-content details-modal">
                <button id="closeDetails" class="close-btn modal-close">&times;</button>
                <img id="detailsImage" src="" alt="" class="details-image">
                <h2 id="detailsTitle" class="details-title"></h2>
                <button id="downloadBtn" class="download-btn" type="button">Download full size</button>
                <div id="detailsTraits" class="details-traits"></div>
                <div id="detailsMint" class="details-mint"></div>
            </div>
        </div>
    </div>

    <script src="app.js?v=20261031e"></script>
</body>
</html>
